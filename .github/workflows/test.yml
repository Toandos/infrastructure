name: Test

on:
  push:
    branches: [ "main" ]

jobs:
  create-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create cluster
        uses: helm/kind-action@v1

      - name: Install cert manager
        run: |
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
          --version v1.21.2 \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true

      - name: Install CAPI Operator
        run: |
          helm repo add capi-operator https://kubernetes-sigs.github.io/cluster-api-operator
          helm repo update
          helm install capi-operator capi-operator/cluster-api-operator --create-namespace -n capi-operator-system

      - name: Wait for CAPI Operator webhook to be ready
        run: |
          kubectl wait --namespace capi-operator-system \
            --for=condition=ready pod \
            --selector=control-plane=controller-manager \
            --timeout=2m
          
          kubectl wait --namespace capi-operator-system \
            --for=jsonpath='{.subsets[0].addresses[0].ip}' \
            endpoints/capi-operator-webhook-service \
            --timeout=1m

      - name: Apply CAPI providers
        working-directory: ./providers
        run: |
          kubectl kustomize . | kubectl apply -f -

      - name: Wait for CAPI providers to be ready
        run: |
          kubectl wait --namespace capi-operator-system \
          --for=condition=Ready \
          --all providers.operator.cluster.x-k8s.io \
          --timeout=2m

      - name: Apply CAPI resources
        working-directory: ./resources
        run: |
          kubectl kustomize . | kubectl apply -f -

      - name: Wait for cluster being ready
        run: |
          echo "Waiting for cluster control plane to report Provisioned status..."
          kubectl wait --for=condition=Ready cluster/production-cluster-01 --timeout=2m
          
          echo "Waiting for Kubeadm control plane to be initialized..."
          kubectl wait --for=jsonpath='{.status.initialized}'=true kubeadmcontrolplane/production-cluster-01-control-plane --timeout=2m